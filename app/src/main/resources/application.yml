server:
  port: 9001
  address: 0.0.0.0

spring:
  application:
    name: ${APPLICATION_NAME:portal-ng-preferences}
  jackson:
    serialization:
      # needed for serializing objects of type object
      fail-on-empty-beans: false
    deserialization:
      # Jackson 3 rejects content after the first JSON value, Jackson 2 accepted such request
      # bodies. Pinned by WireContractIntegrationTest.
      fail-on-trailing-tokens: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs #Keycloak Endpoint
  datasource:
    url: jdbc:postgresql://${PREFERENCES_DB_HOST}:${PREFERENCES_DB_PORT}/${PREFERENCES_DB}
    username: ${PREFERENCES_DB_USERNAME}
    password: ${PREFERENCES_DB_PASSWORD}
    hikari:
      # Explicit, env-overridable pool sizing. Sized to complement the boundedElastic
      # scheduler that runs the blocking JPA calls off the Netty event loop.
      maximum-pool-size: ${PREFERENCES_DB_POOL_MAX_SIZE:10}
      minimum-idle: ${PREFERENCES_DB_POOL_MIN_IDLE:2}
  jpa:
    database: postgresql
    properties:
      hibernate:
        session:
          events:
            log:
              LOG_QUERIES_SLOWER_THAN_MS: 100
        jdbc:
          lob:
            non_contextual_creation: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        type:
          # Hibernate prefers its Jackson 2 mapper as soon as jackson-databind 2 is on the
          # classpath (e.g. pulled in transitively), and that mapper cannot handle the Jackson 3
          # JsonNode of the properties column.
          json_format_mapper: jackson3
  liquibase:
    change-log: "classpath:/db/changelog.xml"
  reactor:
    context-propagation: auto

preferences:
  realm: ${KEYCLOAK_REALM}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  info:
    build:
      enabled: true
    env:
      enabled: true
    git:
      enabled: true
    java:
      enabled: true
  observations:
    enable:
      # Security observations carry no URI, so the untraced-paths predicate cannot drop them
      # and every probe would still export orphaned filter-chain spans. Re-enabling this
      # brings that probe noise back.
      spring.security: false
  tracing:
    export:
      enabled: ${TRACING_ENABLED:true}
      zipkin:
        # Endpoint defaults are needed even when export is disabled: Boot resolves this
        # placeholder while evaluating the exporter's condition, so an unset
        # COLLECTOR_HOST fails startup.
        endpoint: ${COLLECTOR_HOST:http://localhost}:${COLLECTOR_PORT:9411}/api/v2/spans
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}

logger:
  requestIdHeaderName: ${REQUEST_ID_HEADER_NAME:X-Request-Id}
  enabled: true
  excludePaths:
    - "/actuator/**"

logging:
  structured:
    format:
      console: logstash
    json:
      rename:
        traceId: trace_id
        spanId: span_id
  level:
    root: info
